name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          YIDA_PLUGIN_ID: PLUGIN-67B66S81C5GA381DOFQ3C5Q78N5O3HR6WRRVMS2
      - run: npm run demo:build
